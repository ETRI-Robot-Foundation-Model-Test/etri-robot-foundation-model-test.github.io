<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRI Robot Foundation Model Lab</title>
    <style>
        :root {
            --etri-blue: #0054a6;
            --accent: #00a1e1;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --bg-light: #f8f9fa;
        }

        /* 기본 설정 및 부드러운 스크롤 */
        html { scroll-behavior: smooth; }
        body { font-family: 'Pretendard', sans-serif; line-height: 1.7; color: var(--text-main); margin: 0; }

        /* Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 10%; background: white; border-bottom: 1px solid #eee;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.1rem; color: var(--etri-blue); text-decoration: none; }
        .nav-links a { text-decoration: none; color: var(--text-main); margin-left: 2rem; font-weight: 500; }
        .nav-links a:hover { color: var(--etri-blue); }

        /* Hero Section */
        .hero { padding: 5rem 10%; background: var(--bg-light); }
        .hero h1 { font-size: 2.8rem; color: var(--etri-blue); margin: 0; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); margin-top: 1rem; max-width: 800px; }

        section { padding: 5rem 10%; border-bottom: 1px solid #f0f0f0; }
        h2 { font-size: 1.8rem; margin-bottom: 3rem; border-left: 5px solid var(--etri-blue); padding-left: 15px; }

        /* --- Research Item List Style --- */
        .research-container { display: flex; flex-direction: column; gap: 3rem; }

            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
            transition: 0.3s;
            padding: 1.5rem;
            border-radius: 12px;
        }
        .research-item:hover { background-color: #f0f7ff; }
